<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>LexiQuest — Master Every Word</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --surface3: #22223a;
  --border: rgba(255,255,255,0.07);
  --text: #f0eff8;
  --text-muted: #7a79a0;
  --text-dim: #4a4870;
  --accent: #c084fc;
  --accent2: #818cf8;
  --accent3: #34d399;
  --easy: #34d399;
  --moderate: #f59e0b;
  --common: #f472b6;
  --danger: #f87171;
  --glow: rgba(192,132,252,0.15);
  --radius: 16px;
  --radius-sm: 10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background */
.bg-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 60% at 20% -10%, rgba(129,140,248,0.12) 0%, transparent 60%),
              radial-gradient(ellipse 60% 50% at 85% 110%, rgba(192,132,252,0.1) 0%, transparent 55%),
              radial-gradient(ellipse 40% 40% at 50% 50%, rgba(52,211,153,0.04) 0%, transparent 70%);
}

.noise {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Layout */
.app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 0 20px; border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
}
.logo {
  font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 900;
  background: linear-gradient(135deg, #c084fc, #818cf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent3); -webkit-text-fill-color: var(--accent3); font-style: italic; }

.header-stats {
  display: flex; gap: 24px;
}
.stat-pill {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 100px; padding: 6px 16px; font-size: 0.78rem;
  color: var(--text-muted); font-family: 'DM Mono', monospace;
  display: flex; align-items: center; gap: 8px;
}
.stat-pill strong { color: var(--text); font-size: 0.9rem; }

/* Nav Tabs */
.nav-tabs {
  display: flex; gap: 4px; margin-bottom: 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 5px;
}
.nav-tab {
  flex: 1; padding: 10px 16px; border-radius: 12px; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500;
  color: var(--text-muted); background: transparent; transition: all 0.2s;
}
.nav-tab.active {
  background: var(--surface3); color: var(--text);
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.nav-tab:hover:not(.active) { color: var(--text); }

/* Level selector */
.level-bar {
  display: flex; gap: 10px; margin-bottom: 32px; flex-wrap: wrap;
}
.level-btn {
  padding: 8px 22px; border-radius: 100px; border: 1.5px solid;
  cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
  font-weight: 600; letter-spacing: 0.3px; transition: all 0.2s; background: transparent;
}
.level-btn.easy { border-color: var(--easy); color: var(--easy); }
.level-btn.moderate { border-color: var(--moderate); color: var(--moderate); }
.level-btn.common { border-color: var(--common); color: var(--common); }
.level-btn.active.easy { background: var(--easy); color: var(--bg); box-shadow: 0 0 20px rgba(52,211,153,0.3); }
.level-btn.active.moderate { background: var(--moderate); color: var(--bg); box-shadow: 0 0 20px rgba(245,158,11,0.3); }
.level-btn.active.common { background: var(--common); color: var(--bg); box-shadow: 0 0 20px rgba(244,114,182,0.3); }
.level-btn.all { border-color: var(--accent2); color: var(--accent2); }
.level-btn.all.active { background: var(--accent2); color: var(--bg); box-shadow: 0 0 20px rgba(129,140,248,0.3); }

/* Quiz Card */
.quiz-section { min-height: 500px; }

.progress-bar-wrap {
  background: var(--surface2); border-radius: 100px; height: 6px;
  margin-bottom: 32px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 100px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 12px rgba(192,132,252,0.5);
}

.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px; padding: 48px 44px 44px;
  margin-bottom: 24px; position: relative; overflow: hidden;
  animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1);
}
.question-card::before {
  content: ''; position: absolute; top: -60px; right: -60px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, var(--glow), transparent 70%);
  pointer-events: none;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.word-label {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 16px; font-family: 'DM Mono', monospace;
}
.word-display {
  font-family: 'Playfair Display', serif; font-size: clamp(2.8rem, 6vw, 4.5rem);
  font-weight: 900; line-height: 1; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--text) 0%, rgba(240,239,248,0.6) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}
.word-meta {
  font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; align-items: center;
  flex-wrap: wrap;
}
.word-type {
  background: var(--surface3); border-radius: 100px; padding: 3px 12px;
  font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text-muted);
}
.word-level-badge {
  border-radius: 100px; padding: 3px 12px;
  font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 600;
}
.word-level-badge.easy { background: rgba(52,211,153,0.12); color: var(--easy); }
.word-level-badge.moderate { background: rgba(245,158,11,0.12); color: var(--moderate); }
.word-level-badge.common { background: rgba(244,114,182,0.12); color: var(--common); }

.question-text {
  margin-top: 28px; font-size: 1.1rem; color: var(--text-muted); line-height: 1.6;
}

/* Options */
.options-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px;
}
@media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

.option-btn {
  padding: 18px 22px; border-radius: var(--radius); border: 1.5px solid var(--border);
  background: var(--surface2); cursor: pointer; text-align: left;
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--text);
  transition: all 0.18s; position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
}
.option-btn:hover:not(:disabled) {
  border-color: rgba(255,255,255,0.2); background: var(--surface3);
  transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.option-btn .opt-letter {
  width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  background: var(--surface3); color: var(--text-muted); font-family: 'DM Mono', monospace;
  transition: all 0.18s;
}
.option-btn:hover:not(:disabled) .opt-letter {
  background: rgba(255,255,255,0.1); color: var(--text);
}
.option-btn.correct {
  border-color: var(--easy); background: rgba(52,211,153,0.08);
  animation: correctPulse 0.5s ease;
}
.option-btn.correct .opt-letter { background: var(--easy); color: var(--bg); }
.option-btn.wrong {
  border-color: var(--danger); background: rgba(248,113,113,0.08);
  animation: wrongShake 0.4s ease;
}
.option-btn.wrong .opt-letter { background: var(--danger); color: var(--bg); }

@keyframes correctPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Feedback */
.feedback-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 22px; border-radius: var(--radius-sm);
  margin-top: 20px; font-size: 0.92rem; font-weight: 500;
  animation: fadeIn 0.3s ease; display: none;
}
.feedback-bar.show { display: flex; }
.feedback-bar.correct { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--easy); }
.feedback-bar.wrong { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--danger); }
.feedback-icon { font-size: 1.3rem; }
.feedback-explanation { color: var(--text-muted); font-size: 0.85rem; margin-top: 3px; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Next button */
.btn-next {
  margin-top: 20px; padding: 14px 36px; background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none; border-radius: var(--radius-sm); color: #fff; font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: none; box-shadow: 0 4px 20px rgba(192,132,252,0.3);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(192,132,252,0.4); }
.btn-next.show { display: inline-flex; align-items: center; gap: 8px; }

/* Score card */
.score-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 24px; padding: 56px 44px; text-align: center;
  animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1);
}
.score-emoji { font-size: 4rem; margin-bottom: 20px; }
.score-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
.score-num {
  font-size: 5rem; font-weight: 900; font-family: 'Playfair Display', serif;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1; margin: 16px 0;
}
.score-sub { color: var(--text-muted); font-size: 1rem; margin-bottom: 32px; }
.score-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-restart {
  padding: 13px 32px; background: var(--surface3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
}
.btn-restart:hover { background: var(--surface2); border-color: rgba(255,255,255,0.15); }
.btn-primary {
  padding: 13px 32px; background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none; border-radius: var(--radius-sm); color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 0.92rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(192,132,252,0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(192,132,252,0.4); }

/* Word List */
.wordlist-section {}
.section-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  flex-wrap: wrap; gap: 12px;
}
.section-title {
  font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700;
}
.search-input {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 16px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem; width: 220px; transition: all 0.2s; outline: none;
}
.search-input:focus { border-color: rgba(192,132,252,0.4); box-shadow: 0 0 0 3px rgba(192,132,252,0.08); }
.search-input::placeholder { color: var(--text-dim); }

.words-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
}
.word-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  position: relative; transition: all 0.2s;
}
.word-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.word-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.word-card-word { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; }
.word-card-body { margin-top: 8px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
.word-card-options { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
.opt-tag {
  background: var(--surface2); border-radius: 6px; padding: 2px 9px;
  font-size: 0.75rem; color: var(--text-muted);
}
.opt-tag.correct-tag { background: rgba(52,211,153,0.1); color: var(--easy); font-weight: 600; }
.delete-btn {
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  padding: 4px; border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
  font-size: 0.9rem;
}
.delete-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

/* Add Word Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px); z-index: 100; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 24px; padding: 36px; width: 100%; max-width: 520px;
  transform: translateY(20px) scale(0.97); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  max-height: 90vh; overflow-y: auto;
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
.modal-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }

.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; letter-spacing: 0.3px; text-transform: uppercase; font-family: 'DM Mono', monospace; }
.form-input, .form-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 0.92rem; outline: none;
  transition: all 0.2s;
}
.form-input:focus, .form-select:focus { border-color: rgba(192,132,252,0.4); box-shadow: 0 0 0 3px rgba(192,132,252,0.08); }
.form-select option { background: var(--surface2); }

.options-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-input-wrap { position: relative; }
.opt-input-wrap .opt-marker {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 0.72rem; font-weight: 700; color: var(--text-dim); font-family: 'DM Mono', monospace;
}
.opt-input-wrap .form-input { padding-left: 30px; }
.correct-opt-note { font-size: 0.75rem; color: var(--accent3); margin-top: 6px; }

.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; }
.btn-cancel {
  padding: 10px 22px; background: var(--surface3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,0.15); }

/* Toast */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface3); border: 1px solid var(--border);
  border-radius: 100px; padding: 10px 22px; font-size: 0.88rem;
  font-weight: 500; z-index: 200; opacity: 0; transition: all 0.3s;
  pointer-events: none; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { color: var(--easy); border-color: rgba(52,211,153,0.2); }
.toast.error { color: var(--danger); border-color: rgba(248,113,113,0.2); }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state svg { opacity: 0.2; margin-bottom: 16px; }
.empty-state p { font-size: 0.9rem; }

/* Floating add button */
.fab {
  position: fixed; bottom: 36px; right: 36px; z-index: 50;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none; cursor: pointer; color: #fff; font-size: 1.5rem;
  box-shadow: 0 8px 32px rgba(192,132,252,0.4); transition: all 0.25s;
  display: flex; align-items: center; justify-content: center;
}
.fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 40px rgba(192,132,252,0.5); }

/* Streaks / Stats row */
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.stat-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
}
.stat-box-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; font-family: 'DM Mono', monospace; margin-bottom: 6px; }
.stat-box-val { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; }
.stat-box-val.green { color: var(--easy); }
.stat-box-val.amber { color: var(--moderate); }
.stat-box-val.purple { color: var(--accent); }

/* Pagination */
.pagination { display: flex; gap: 6px; margin-top: 24px; flex-wrap: wrap; }
.page-btn {
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-muted); cursor: pointer;
  font-size: 0.82rem; transition: all 0.15s;
}
.page-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.page-btn:hover:not(.active) { border-color: rgba(255,255,255,0.15); color: var(--text); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

// LexiQuest App Logic

// ─── Storage ──────────────────────────────────────────────────────────────────
const DB_KEY = 'lexiquest_custom_words';
const STATS_KEY = 'lexiquest_stats';
const BEST_KEY = 'lexiquest_best';

function getCustomWords() {
  try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); } catch { return []; }
}
function saveCustomWords(arr) {
  localStorage.setItem(DB_KEY, JSON.stringify(arr));
}
function getStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{"total":0,"correct":0,"sessions":0,"history":[]}'); } catch { return {total:0,correct:0,sessions:0,history:[]}; }
}
function saveStats(s) { localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
function getBest() { return parseInt(localStorage.getItem(BEST_KEY) || '0'); }
function saveBest(n) { localStorage.setItem(BEST_KEY, String(n)); }

// ─── All Words ─────────────────────────────────────────────────────────────────
function getAllWords() {
  return [...BUILTIN_WORDS, ...getCustomWords()];
}

// ─── Quiz State ────────────────────────────────────────────────────────────────
let quiz = {
  level: 'all',
  queue: [],
  current: 0,
  score: 0,
  answered: false,
  total: 20,
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue(level) {
  let words = getAllWords();
  if (level !== 'all') words = words.filter(w => w.level === level);
  if (words.length === 0) words = getAllWords();
  return shuffle(words).slice(0, quiz.total);
}

function startQuiz(level) {
  quiz.level = level || quiz.level;
  quiz.queue = buildQueue(quiz.level);
  quiz.current = 0;
  quiz.score = 0;
  quiz.answered = false;
  renderQuestion();
  updateProgress();
}

function renderQuestion() {
  const section = document.getElementById('quizSection');
  if (quiz.current >= quiz.queue.length) {
    showScore();
    return;
  }
  const word = quiz.queue[quiz.current];
  const allOpts = shuffle([word.correct, ...word.options]);
  // Store correct answer on quiz state to avoid injection issues
  quiz._correct = word.correct;

  section.innerHTML = `
    <div class="question-card">
      <div class="word-label">What does this word mean?</div>
      <div class="word-display">${word.word}</div>
      <div class="word-meta">
        ${word.pos ? `<span class="word-type">${word.pos}</span>` : ''}
        <span class="word-level-badge ${word.level}">${levelLabel(word.level)}</span>
        <span style="font-size:0.78rem">${quiz.current + 1} of ${quiz.queue.length}</span>
      </div>
      <div class="options-grid" id="optionsGrid">
        ${allOpts.map((opt, i) => `
          <button class="option-btn" onclick="selectAnswer(this)" data-val="${escHtml(opt)}">
            <span class="opt-letter">${'ABCD'[i]}</span>
            <span>${escHtml(opt)}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback-bar" id="feedbackBar">
        <span class="feedback-icon" id="feedbackIcon"></span>
        <div>
          <div id="feedbackText"></div>
          ${word.example ? `<div class="feedback-explanation">"${word.example}"</div>` : ''}
        </div>
      </div>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">
        ${quiz.current + 1 < quiz.queue.length ? 'Next Word →' : 'See Results 🏆'}
      </button>
    </div>
  `;
}

function escHtml(str) {
  return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

function levelLabel(l) {
  return l === 'easy' ? '🌱 Easy' : l === 'moderate' ? '🔥 Moderate' : '⭐ Common';
}

function selectAnswer(btn) {
  if (quiz.answered) return;
  quiz.answered = true;
  const selected = btn.dataset.val;
  const correct = quiz._correct;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.dataset.val === correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedbackBar');
  const fbText = document.getElementById('feedbackText');
  const fbIcon = document.getElementById('feedbackIcon');
  const btnNext = document.getElementById('btnNext');

  if (selected === correct) {
    btn.classList.add('correct');
    fb.className = 'feedback-bar show correct';
    fbIcon.textContent = '✓';
    fbText.textContent = 'Excellent! That is correct.';
    quiz.score++;
    confettiPop();
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback-bar show wrong';
    fbIcon.textContent = '✗';
    fbText.textContent = 'Not quite. The correct answer is: ' + correct;
  }

  btnNext.classList.add('show');
  updateProgress();
}

function nextQuestion() {
  quiz.current++;
  quiz.answered = false;
  renderQuestion();
  updateProgress();
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  const pct = quiz.queue.length ? (quiz.current / quiz.queue.length) * 100 : 0;
  fill.style.width = pct + '%';
}

function showScore() {
  const section = document.getElementById('quizSection');
  const pct = Math.round((quiz.score / quiz.queue.length) * 100);

  // Update stats
  const stats = getStats();
  stats.total += quiz.queue.length;
  stats.correct += quiz.score;
  stats.sessions++;
  stats.history.unshift({ date: new Date().toLocaleDateString(), score: quiz.score, total: quiz.queue.length, level: quiz.level });
  if (stats.history.length > 20) stats.history.pop();
  saveStats(stats);

  if (quiz.score > getBest()) saveBest(quiz.score);

  updateHeaderStats();

  let emoji = '😐';
  let msg = 'Keep practicing!';
  if (pct >= 90) { emoji = '🏆'; msg = 'Outstanding! You\'re a word master!'; }
  else if (pct >= 70) { emoji = '🌟'; msg = 'Great job! You\'re almost there!'; }
  else if (pct >= 50) { emoji = '👍'; msg = 'Good effort! Practice makes perfect.'; }
  else if (pct < 30) { emoji = '📚'; msg = 'Time to study more words!'; }

  section.innerHTML = `
    <div class="score-card">
      <div class="score-emoji">${emoji}</div>
      <div class="score-title">${msg}</div>
      <div class="score-num">${quiz.score}/${quiz.queue.length}</div>
      <div class="score-sub">${pct}% accuracy — ${quiz.queue.length} words tested</div>
      <div class="score-actions">
        <button class="btn-restart" onclick="startQuiz()">🔄 Try Again</button>
        <button class="btn-primary" onclick="startQuiz('all')">⚡ New Round</button>
      </div>
    </div>
  `;
  document.getElementById('progressFill').style.width = '100%';
}

// ─── Level Selection ───────────────────────────────────────────────────────────
function setLevel(level) {
  quiz.level = level;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.level-btn.${level === 'all' ? 'all' : level}`);
  if (btn) btn.classList.add('active');
  startQuiz(level);
}

// ─── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('tab-quiz').style.display = tab === 'quiz' ? 'block' : 'none';
  document.getElementById('tab-library').style.display = tab === 'library' ? 'block' : 'none';
  document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
  document.querySelectorAll('.nav-tab').forEach((b, i) => {
    b.classList.toggle('active', ['quiz','library','stats'][i] === tab);
  });
  if (tab === 'library') renderLibrary();
  if (tab === 'stats') renderStats();
}

// ─── Library ───────────────────────────────────────────────────────────────────
let libFilter = 'all';
let libSearch = '';
let libPage = 0;
const PER_PAGE = 24;

function renderLibrary() {
  const all = getAllWords();
  let filtered = all;
  if (libFilter !== 'all') filtered = filtered.filter(w => w.level === libFilter);
  if (libSearch) {
    const q = libSearch.toLowerCase();
    filtered = filtered.filter(w => w.word.toLowerCase().includes(q) || w.correct.toLowerCase().includes(q));
  }

  const total = filtered.length;
  const pages = Math.ceil(total / PER_PAGE);
  const start = libPage * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  const grid = document.getElementById('wordsGrid');
  if (!slice.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No words found. Try a different filter or add new words!</p></div>`;
  } else {
    grid.innerHTML = slice.map(w => {
      const isCustom = !BUILTIN_WORDS.find(b => b.word === w.word && b.correct === w.correct);
      return `
        <div class="word-card">
          <div class="word-card-head">
            <div>
              <div class="word-card-word">${w.word}</div>
              <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
                ${w.pos ? `<span class="word-type">${w.pos}</span>` : ''}
                <span class="word-level-badge ${w.level}">${levelLabel(w.level)}</span>
                ${isCustom ? '<span style="font-size:0.68rem;background:rgba(192,132,252,0.15);color:var(--accent);border-radius:100px;padding:2px 8px">Custom</span>' : ''}
              </div>
            </div>
            ${isCustom ? `<button class="delete-btn" onclick="deleteWord('${escHtml(w.word)}','${escHtml(w.correct)}')" title="Delete">🗑</button>` : ''}
          </div>
          <div class="word-card-body">${w.correct}</div>
          ${w.example ? `<div style="font-size:0.78rem;color:var(--text-dim);margin-top:6px;font-style:italic">"${w.example}"</div>` : ''}
          <div class="word-card-options">
            <span class="opt-tag correct-tag">✓ ${w.correct.length > 40 ? w.correct.slice(0,40)+'…' : w.correct}</span>
            ${w.options.map(o => `<span class="opt-tag">${o.length > 35 ? o.slice(0,35)+'…' : o}</span>`).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  // Pagination
  const pag = document.getElementById('libraryPagination');
  if (pages <= 1) { pag.innerHTML = ''; return; }
  pag.innerHTML = Array.from({length: pages}, (_, i) =>
    `<button class="page-btn ${i === libPage ? 'active' : ''}" onclick="goLibPage(${i})">${i+1}</button>`
  ).join('');
}

function goLibPage(p) {
  libPage = p;
  renderLibrary();
  document.getElementById('tab-library').scrollIntoView({behavior:'smooth'});
}

function filterLibrary(f) {
  libFilter = f;
  libPage = 0;
  document.querySelectorAll('#tab-library .level-btn').forEach(b => b.classList.remove('active'));
  const map = {all:'lib-all',easy:'lib-easy',moderate:'lib-mod',common:'lib-com'};
  const el = document.getElementById(map[f]);
  if (el) el.classList.add('active');
  renderLibrary();
}

function searchWords(q) {
  libSearch = q;
  libPage = 0;
  renderLibrary();
}

function deleteWord(word, correct) {
  const customs = getCustomWords();
  const idx = customs.findIndex(w => w.word === word && w.correct === correct);
  if (idx !== -1) {
    customs.splice(idx, 1);
    saveCustomWords(customs);
    showToast('Word deleted', 'success');
    renderLibrary();
    updateHeaderStats();
  }
}

// ─── Add Word Modal ────────────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('inp-word').focus();
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  clearModal();
}
function clearModal() {
  ['inp-word','inp-pos','inp-correct','inp-w1','inp-w2','inp-w3','inp-example'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('inp-level').value = 'common';
}

function saveWord() {
  const word = document.getElementById('inp-word').value.trim();
  const pos = document.getElementById('inp-pos').value.trim();
  const correct = document.getElementById('inp-correct').value.trim();
  const w1 = document.getElementById('inp-w1').value.trim();
  const w2 = document.getElementById('inp-w2').value.trim();
  const w3 = document.getElementById('inp-w3').value.trim();
  const level = document.getElementById('inp-level').value;
  const example = document.getElementById('inp-example').value.trim();

  if (!word) { showToast('Please enter a word', 'error'); return; }
  if (!correct) { showToast('Please enter the correct definition', 'error'); return; }
  if (!w1 || !w2 || !w3) { showToast('Please enter 3 wrong options', 'error'); return; }

  const newWord = { word, pos, correct, options: [w1, w2, w3], level, example };
  const customs = getCustomWords();

  // Check for duplicate
  const exists = getAllWords().find(w => w.word.toLowerCase() === word.toLowerCase());
  if (exists) { showToast('This word already exists!', 'error'); return; }

  customs.push(newWord);
  saveCustomWords(customs);
  closeModal();
  showToast(`"${word}" added successfully! 🎉`, 'success');
  updateHeaderStats();
  if (document.getElementById('tab-library').style.display !== 'none') renderLibrary();
}

// ─── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const stats = getStats();
  const accuracy = stats.total ? Math.round((stats.correct / stats.total) * 100) : 0;
  const total = getAllWords().length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="stat-box-label">Total Answered</div><div class="stat-box-val purple">${stats.total}</div></div>
    <div class="stat-box"><div class="stat-box-label">Correct Answers</div><div class="stat-box-val green">${stats.correct}</div></div>
    <div class="stat-box"><div class="stat-box-label">Accuracy</div><div class="stat-box-val amber">${accuracy}%</div></div>
    <div class="stat-box"><div class="stat-box-label">Sessions Played</div><div class="stat-box-val purple">${stats.sessions}</div></div>
    <div class="stat-box"><div class="stat-box-label">Best Score</div><div class="stat-box-val green">${getBest()}/${quiz.total}</div></div>
    <div class="stat-box"><div class="stat-box-label">Words Available</div><div class="stat-box-val amber">${total}</div></div>
  `;

  const activity = document.getElementById('recentActivity');
  if (!stats.history.length) {
    activity.innerHTML = `<div class="empty-state"><p>No sessions yet. Start practicing!</p></div>`;
    return;
  }
  activity.innerHTML = `
    <div class="section-title" style="font-size:1.1rem;margin-bottom:14px;font-family:'DM Sans',sans-serif;font-weight:600;color:var(--text-muted)">Recent Sessions</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${stats.history.map(h => {
        const p = Math.round((h.score/h.total)*100);
        const col = p >= 70 ? 'var(--easy)' : p >= 50 ? 'var(--moderate)' : 'var(--danger)';
        return `
          <div style="display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px">
            <div style="font-size:0.82rem;color:var(--text-muted);min-width:80px">${h.date}</div>
            <div style="flex:1;background:var(--surface2);border-radius:100px;height:6px;overflow:hidden">
              <div style="height:100%;width:${p}%;background:${col};border-radius:100px"></div>
            </div>
            <div style="font-family:'DM Mono',monospace;font-size:0.82rem;color:${col};font-weight:600;min-width:50px;text-align:right">${h.score}/${h.total}</div>
            <span class="word-level-badge ${h.level}" style="font-size:0.68rem">${levelLabel(h.level)}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ─── Header Stats ──────────────────────────────────────────────────────────────
function updateHeaderStats() {
  document.getElementById('totalWordsCount').innerHTML = `📚 <strong>${getAllWords().length}</strong> words`;
  document.getElementById('bestScoreCount').innerHTML = `🏆 Best: <strong>${getBest()}/${quiz.total}</strong>`;
}

// ─── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); }, 2800);
}

// ─── Confetti ──────────────────────────────────────────────────────────────────
function confettiPop() {
  const colors = ['#c084fc','#818cf8','#34d399','#f59e0b','#f472b6'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.style.cssText = `
      position:fixed;z-index:999;pointer-events:none;
      width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${30+Math.random()*40}%;top:${20+Math.random()*30}%;
      animation:confettiFall 1.2s ease forwards;
      transform:rotate(${Math.random()*360}deg);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
}

// Add confetti CSS
const s = document.createElement('style');
s.textContent = `@keyframes confettiFall {
  0% { opacity:1; transform:translateY(0) rotate(0deg); }
  100% { opacity:0; transform:translateY(${150+Math.random()*100}px) rotate(${360+Math.random()*360}deg); }
}`;
document.head.appendChild(s);

// ─── Close modal on overlay click ──────────────────────────────────────────────
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ─── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('modalOverlay').classList.contains('open')) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.key === 'Enter') {
    const next = document.getElementById('btnNext');
    if (next && next.classList.contains('show')) nextQuestion();
  }
  if (!quiz.answered && ['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase())) {
    const map = {'1':0,'a':0,'2':1,'b':1,'3':2,'c':2,'4':3,'d':3};
    const btns = document.querySelectorAll('.option-btn');
    const idx = map[e.key.toLowerCase()];
    if (btns[idx]) selectAnswer(btns[idx]);
  }
});

// ─── Init ──────────────────────────────────────────────────────────────────────
updateHeaderStats();
startQuiz('all');

</script>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner">
    <div class="banner-icon">📱</div>
    <div class="banner-text">
      <div class="banner-title">Install LexiQuest</div>
      <div class="banner-sub">Add to home screen for offline use</div>
    </div>
    <button class="banner-btn" id="pwa-install-btn">Install</button>
    <button class="banner-close" id="pwa-dismiss-btn">✕</button>
  </div>

  <!-- Offline indicator -->
  <div id="pwa-offline-toast">⚡ Offline mode — all words available</div>

  <script>
  // ═══════════════ SERVICE WORKER (Inline Blob) ═══════════════
  (function() {
    if (!('serviceWorker' in navigator)) return;

    // Inline the SW as a blob so it works from any file:// or http:// context
    const swCode = `// LexiQuest Service Worker — Full Offline Support
// Caches everything on first load so the app works with NO internet

const CACHE_NAME = 'lexiquest-v1';
const OFFLINE_URLS = [
  './',
  './index.html',
  './manifest.json',
  // icons inlined
];

// ── Install: cache all core files immediately ─────────────────────────────────
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache => {
      return cache.addAll(OFFLINE_URLS);
    }).then(() => {
      // Force the waiting service worker to become the active one
      return self.skipWaiting();
    })
  );
});

// ── Activate: clean up old caches ────────────────────────────────────────────
self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(cacheNames => {
      return Promise.all(
        cacheNames
          .filter(name => name !== CACHE_NAME)
          .map(name => caches.delete(name))
      );
    }).then(() => self.clients.claim())
  );
});

// ── Fetch: serve from cache, fall back to network ────────────────────────────
self.addEventListener('fetch', event => {
  // Only handle GET requests
  if (event.request.method !== 'GET') return;

  const url = new URL(event.request.url);

  // For Google Fonts (used by the app) — try network first, then cache
  if (url.hostname === 'fonts.googleapis.com' || url.hostname === 'fonts.gstatic.com') {
    event.respondWith(
      caches.open(CACHE_NAME).then(cache => {
        return fetch(event.request)
          .then(response => {
            // Cache the font for offline use
            if (response.ok) cache.put(event.request, response.clone());
            return response;
          })
          .catch(() => cache.match(event.request));
      })
    );
    return;
  }

  // For all other requests — cache first, network fallback
  event.respondWith(
    caches.match(event.request).then(cached => {
      if (cached) return cached;

      return fetch(event.request).then(response => {
        // Cache successful responses
        if (response && response.ok) {
          const cloned = response.clone();
          caches.open(CACHE_NAME).then(cache => cache.put(event.request, cloned));
        }
        return response;
      }).catch(() => {
        // Fully offline fallback — return the main app page
        return caches.match('./index.html');
      });
    })
  );
});
`;

    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);

    navigator.serviceWorker.register(swUrl, { scope: './' })
      .then(reg => {
        console.log('LexiQuest SW registered:', reg.scope);
        // Check for updates
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('LexiQuest: New content available');
            }
          });
        });
      })
      .catch(err => console.log('LexiQuest SW error:', err));
  })();

  // ═══════════════ INSTALL PROMPT ═══════════════
  (function() {
    let deferredPrompt = null;
    const banner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const dismissBtn = document.getElementById('pwa-dismiss-btn');
    const offlineToast = document.getElementById('pwa-offline-toast');

    // Show banner when browser fires beforeinstallprompt
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // Only show if not dismissed before
      if (!localStorage.getItem('pwa_install_dismissed')) {
        setTimeout(() => banner.classList.add('show'), 2000);
      }
    });

    installBtn && installBtn.addEventListener('click', async () => {
      banner.classList.remove('show');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        deferredPrompt = null;
      }
    });

    dismissBtn && dismissBtn.addEventListener('click', () => {
      banner.classList.remove('show');
      localStorage.setItem('pwa_install_dismissed', '1');
    });

    // Hide banner once installed
    window.addEventListener('appinstalled', () => {
      banner.classList.remove('show');
      deferredPrompt = null;
      showToast('App installed! 🎉', 'success');
    });

    // Offline / online indicator
    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineToast.classList.add('show');
      } else {
        offlineToast.classList.remove('show');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  })();
  </script>
